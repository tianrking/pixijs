name: PixiJS isolated native validation

on:
  push:
    branches: [codex/pixijs-native-validation]

permissions:
  contents: read

concurrency:
  group: pixijs-isolated-native-validation
  cancel-in-progress: false

env:
  VALIDATION_PHASE: green
  CODE_REF: 3bc45908f963e257bc1c8890c18543fe2c036900

jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.VALIDATION_PHASE == 'green' && env.CODE_REF || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: phase
        shell: bash
        run: |
          echo "phase=$VALIDATION_PHASE" >> "$GITHUB_OUTPUT"
          mkdir -p .native-evidence
          git rev-parse HEAD | tee .native-evidence/head.txt
          sha256sum src/dom/*.ts src/dom/__tests__/*.ts > .native-evidence/source-sha256.txt
      - name: Canonical project setup (Node 24.15.0, npm 11, Electron)
        uses: ./.github/actions/setup
      - name: Required pre-commit hook on the exact source diff
        if: env.VALIDATION_PHASE == 'green'
        shell: bash
        run: |
          formal_head=$(git rev-parse HEAD)
          expected_tree=$(git rev-parse HEAD^{tree})
          git reset --soft HEAD^
          sh .husky/pre-commit 2>&1 | tee .native-evidence/pre-commit.log
          mkdir -p .native-evidence/source-after-hook
          cp src/dom/DOMContainer.ts src/dom/DOMPipe.ts src/dom/__tests__/DOMContainer.element.test.ts .native-evidence/source-after-hook/
          test "$(git write-tree)" = "$expected_tree"
          git reset --hard "$formal_head"
          test "$(git rev-parse HEAD)" = "$CODE_REF"
      - name: Real Electron DOM lifecycle tests
        id: dom
        shell: bash
        env:
          NODE_ENV: production
        run: |
          xvfb-run --auto-servernum npm run test -- unit --testPathPattern=src/dom/ --maxWorkers=2 2>&1 | tee .native-evidence/dom.log
      - name: Canonical lint, types, index, prune and DTS checks
        if: env.VALIDATION_PHASE == 'green'
        uses: ./.github/actions/lint
      - name: Canonical complete native unit suite
        if: always() && env.VALIDATION_PHASE == 'green' && steps.dom.outcome == 'success'
        uses: ./.github/actions/unit
        with:
          type: Unit
      - name: Canonical distribution build
        if: success() && env.VALIDATION_PHASE == 'green'
        run: npm run dist
      - name: Save immutable native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ env.VALIDATION_PHASE }}-${{ github.sha }}
          path: .native-evidence/
          include-hidden-files: true

  visuals:
    needs: native
    if: needs.native.outputs.phase == 'green' && needs.native.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CODE_REF }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Canonical macOS visual suite
        uses: ./.github/actions/unit
        with:
          type: Visuals

  original-controls:
    needs: native
    if: always() && needs.native.outputs.phase == 'red'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2eeb54e3dc21f1380b9c01c9ca44c1a5bbe154fb
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Original twelve-case source evidence
        run: |
          mkdir -p .native-evidence
          git rev-parse HEAD > .native-evidence/control-head.txt
          sha256sum src/dom/*.ts src/dom/__tests__/*.ts > .native-evidence/control-source-sha256.txt
      - name: Individually reported original positive controls
        shell: bash
        env:
          NODE_ENV: production
        run: |
          xvfb-run --auto-servernum npm run test -- unit --testPathPattern=src/dom/__tests__/DOMContainer.element.test.ts '--testNamePattern=preserve an externally parented|leave the rendered element and its focus|preserve the previous element' --verbose --maxWorkers=2 2>&1 | tee .native-evidence/controls.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: original-control-evidence-${{ github.sha }}
          path: .native-evidence/
          include-hidden-files: true
